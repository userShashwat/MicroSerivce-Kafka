name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build User Service
        run: |
          cd User/Service
          mvn clean package -DskipTests

      - name: Build Order Service
        run: |
          cd Order/Service
          mvn clean package -DskipTests

      - name: Build Notification Service
        run: |
          cd Notification/Service
          mvn clean package -DskipTests

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,init.sql,User/Service/Dockerfile,User/Service/target/*.jar,Order/Service/Dockerfile,Order/Service/target/*.jar,Notification/Service/Dockerfile,Notification/Service/target/*.jar,Notification/Service/src/main/resources/templates"
          target: "/home/ec2-user/kafka-project"
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD,MAILTRAP_USERNAME,MAILTRAP_PASSWORD
          script: |
            cd /home/ec2-user/kafka-project

            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            export MAILTRAP_USERNAME=${{ secrets.MAILTRAP_USERNAME }}
            export MAILTRAP_PASSWORD=${{ secrets.MAILTRAP_PASSWORD }}

            docker-compose down
            docker-compose up --build -d

            echo "Deployment complete"
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MAILTRAP_USERNAME: ${{ secrets.MAILTRAP_USERNAME }}
          MAILTRAP_PASSWORD: ${{ secrets.MAILTRAP_PASSWORD }}
