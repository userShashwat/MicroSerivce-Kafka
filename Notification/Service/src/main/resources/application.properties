spring.application.name=Service
# Server
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/notification_db
spring.datasource.username=root
spring.datasource.password=shashwat@16
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=f29baaeadffd98
spring.mail.password=c76eebcba199a1
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Resilience4j retry
resilience4j.retry.instances.emailRetry.max-attempts=3
resilience4j.retry.instances.emailRetry.wait-duration=2s
resilience4j.retry.instances.emailRetry.enable-exponential-backoff=true
resilience4j.retry.instances.emailRetry.exponential-backoff-multiplier=2

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.emailCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.emailCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.emailCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.emailCircuitBreaker.register-health-indicator=true